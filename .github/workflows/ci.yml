name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4.7
        bundler-cache: false
    
    - name: Install dependencies
      run: |
        bundle install
        pod install
    
    - name: Run security audit
      run: |
        bundle exec bundle-audit check --update
    

    
    - name: Run tests
      env:
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      run: bundle exec fastlane test
    
    - name: Debug test output
      if: success()
      run: |
        echo "Contents of test_output directory:"
        ls -la ./test_output/ || echo "test_output directory not found"
        echo "Looking for xcresult files:"
        find . -name "*.xcresult" -type d 2>/dev/null || echo "No xcresult files found"
    

    

    - name: Upload test results and reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-and-reports
        path: |
          test_output/