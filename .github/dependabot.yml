version: 2
updates:
  # Ruby dependencies
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "seanoshea"
    assignees:
      - "seanoshea"
    commit-message:
      prefix: "deps"
      include: "scope"
    
  # CocoaPods dependencies
  - package-ecosystem: "cocoapods"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 5
    reviewers:
      - "seanoshea"
    assignees:
      - "seanoshea"
    commit-message:
      prefix: "deps"
      include: "scope"
    
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
    open-pull-requests-limit: 3
    reviewers:
      - "seanoshea"
    assignees:
      - "seanoshea"
    commit-message:
      prefix: "ci"
      include: "scope"